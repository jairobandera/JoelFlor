<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Lista de Regalos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="login-header">
        <span class="lock-icon">🔒</span>
        <h2>Panel de Administración</h2>
        <p>Florencia & Joel - Lista de Regalos</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
        <p id="login-error" class="error-message"></p>
      </form>
    </div>
  </div>

  <div id="admin-panel" class="admin-panel" style="display: none;">
    <header class="admin-header">
      <div class="admin-header-content">
        <h1>🎁 Panel de Administración</h1>
        <div class="admin-actions">
          <button id="logout-btn" class="btn btn-outline">Cerrar Sesión</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="stats-bar">
        <div class="stat-card">
          <span class="stat-number" id="total-gifts">0</span>
          <span class="stat-label">Total Regalos</span>
        </div>
        <div class="stat-card stat-available">
          <span class="stat-number" id="available-gifts">0</span>
          <span class="stat-label">Disponibles</span>
        </div>
        <div class="stat-card stat-chosen">
          <span class="stat-number" id="chosen-gifts">0</span>
          <span class="stat-label">Elegidos</span>
        </div>
      </div>

      <div class="admin-toolbar">
        <button id="add-gift-btn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Agregar Regalo
        </button>
        <button id="refresh-btn" class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Actualizar
        </button>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>

      <div class="gifts-table-container">
        <table id="gifts-table" class="gifts-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Regalo</th>
              <th>Link</th>
              <th>Estado</th>
              <th>Imagen</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="gifts-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal" id="gift-modal">
      <div class="modal-header">
        <h3 id="modal-title">Agregar Regalo</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="gift-form">
        <input type="hidden" id="gift-id">
        <div class="form-group">
          <label for="gift-name">Nombre del Regalo *</label>
          <input type="text" id="gift-name" required placeholder="Ej: Microondas">
        </div>
        <div class="form-group">
          <label for="gift-link">Link de MercadoLibre</label>
          <input type="url" id="gift-link" placeholder="https://www.mercadolibre.com.uy/...">
          <button type="button" id="fetch-image-btn" class="btn btn-small btn-outline">
            🔍 Extraer imagen del link
          </button>
        </div>
        <div class="form-group">
          <label for="gift-image">URL de Imagen</label>
          <input type="url" id="gift-image" placeholder="https://...">
          <small>Se extrae automáticamente del link de MercadoLibre</small>
        </div>
        <div class="form-group">
          <label for="gift-status">Estado</label>
          <select id="gift-status">
            <option value="disponible">Disponible</option>
            <option value="elegido">Elegido</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/admin.js"></script>
</body>
</html>
